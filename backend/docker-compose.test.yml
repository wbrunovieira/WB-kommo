services:
  postgres-test:
    image: postgres:16-alpine
    container_name: wb-kommo-postgres-test
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_TEST_DB}
    tmpfs:
      - /var/lib/postgresql/data   # in-memory, throwaway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_TEST_DB}"]
      interval: 3s
      timeout: 5s
      retries: 15
    networks:
      - wb-test-network

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: wb-kommo-test-runner
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-test:5432/${POSTGRES_TEST_DB}
      SESSION_JWT_SECRET: ${SESSION_JWT_SECRET}
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: http://localhost:3000
      STORAGE_TYPE: local
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - wb-test-network

networks:
  wb-test-network:
    driver: bridge
