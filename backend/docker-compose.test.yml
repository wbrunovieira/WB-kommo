services:
  postgres-test:
    image: postgres:16-alpine
    container_name: wb-kommo-postgres-test
    environment:
      POSTGRES_USER: wb_user
      POSTGRES_PASSWORD: wb_pass
      POSTGRES_DB: wb_kommo_test
    tmpfs:
      - /var/lib/postgresql/data   # in-memory, throwaway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wb_user -d wb_kommo_test"]
      interval: 3s
      timeout: 5s
      retries: 15
    networks:
      - wb-test-network

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: wb-kommo-test-runner
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://wb_user:wb_pass@postgres-test:5432/wb_kommo_test
      SESSION_JWT_SECRET: test-session-secret-minimum-32-chars-ok
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: http://localhost:3000
      STORAGE_TYPE: local
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - wb-test-network

networks:
  wb-test-network:
    driver: bridge
